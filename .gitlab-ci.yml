# Pipeline CI (13/08/2026) — test + build + scan de vulnérabilités, pas de déploiement (bloqué
# sur le serveur cible, pas encore accessible à ce stade). Runner unique (wsl2-docker-runner, tag
# "docker"), exécuteur Docker enregistré avec le socket de l'hôte monté (--docker-volumes
# /var/run/docker.sock:...) : les jobs parlent directement au daemon Docker de la machine de dev,
# pas de docker:dind séparé — même daemon que celui utilisé manuellement toute la session.
#
# Le runner tourne lui-même en conteneur (`docker run --name gitlab-runner ...
# gitlab/gitlab-runner:latest`, restart policy `always`) sur cette machine de dev, sous Docker
# Desktop (WSL2). Incident 17/08/2026 : conteneur arrêté (gris dans Settings > CI/CD > Runners,
# jobs bloqués "aucun runner en ligne") après un arrêt de la machine, alors que sa restart policy
# est bien `always` — Docker Desktop lui-même n'avait pas redémarré avec la machine, donc aucun
# daemon pour honorer la policy. Fix ponctuel : `docker start gitlab-runner`. Fix durable :
# Docker Desktop > Settings > General > "Start Docker Desktop when you sign in to your computer"
# (pas une commande WSL2 — appli Windows). Rien à changer côté `docker run`/restart policy.

stages:
  - build
  - verify

variables:
  BACKEND_IMAGE: "cybervuln-backend:ci-$CI_COMMIT_SHORT_SHA"
  FRONTEND_IMAGE: "cybervuln-frontend-prod:ci-$CI_COMMIT_SHORT_SHA"

default:
  image: docker:24-cli
  tags:
    - docker

build-backend:
  stage: build
  script:
    - docker build -t $BACKEND_IMAGE ./backend

build-frontend:
  stage: build
  script:
    # --target prod : valide le build Vite (npm ci && npm run build, cf. frontend/Dockerfile
    # stage "build") en plus du stage nginx — même image que frontend-prod en local.
    - docker build -t $FRONTEND_IMAGE --target prod ./frontend

build-agent:
  # 17/08/2026 — build croisé de l'agent (.exe/.msi Windows + .deb Linux), jamais fait avant
  # (le seul chemin de build était manuel, cf. agent/README.md). Ajouté après un build local
  # WSL2 systématiquement bloqué sur la compilation C de `ring` (dépendance de reqwest,
  # inchangée) — reproductible même avec un mingw-w64 système propre, jamais en rejouant la
  # même commande à la main : symptôme propre à cet environnement WSL2, pas à `ring` lui-même
  # ni à ce code. Un vrai conteneur Docker (ce job) est le test qui manquait pour trancher —
  # et sert désormais de pipeline de build reproductible, plus besoin de dépendre du poste
  # de dev pour produire un `.msi`/`.deb` de release.
  #
  # image dédiée (pas `docker:24-cli` comme les jobs ci-dessus, qui ne parlent qu'au daemon
  # Docker de l'hôte) : ce job a besoin d'un vrai environnement Rust, pas de builder une image
  # Docker. ⚠️ **`rust:1-trixie` obligatoire, pas `rust:1-bookworm`** — vérifié en conditions
  # réelles (conteneur, 17/08/2026) : `wixl` 0.101 (Debian bookworm/stable) ne comprend pas du
  # tout l'élément `<Environment>` de `wix/main.wxs` et **plante** ("unhandled child Component
  # node Environment", ne produit aucun `.msi`) — seul `wixl` 0.106 (Debian trixie, testing) le
  # supporte. Écart constaté entre deux versions Debian du même outil, à revérifier si l'image
  # de base change un jour.
  stage: build
  image: rust:1-trixie
  rules:
    # Coûteux (install mingw-w64/wixl/msitools/cargo-deb à chaque run, pas de cache) et sans
    # rapport avec le reste du dépôt — ne tourne que si l'agent Rust a changé, pas à chaque
    # commit backend/frontend.
    - changes:
        - agent/**/*
  script:
    # msitools (paquet séparé de wixl, fournit `msiinfo`) : nécessaire seulement pour les
    # vérifications post-build ci-dessous, pas pour construire le `.msi` lui-même.
    # osslsigncode (18/08/2026) : signature Authenticode du `.exe`/`.msi`, cf. bloc signature
    # plus bas — tourne nativement sous Linux, pas besoin de `signtool`/Windows SDK.
    - apt-get update && apt-get install -y --no-install-recommends mingw-w64 wixl msitools osslsigncode
    # gcc-mingw-w64 est un paquet "alternatives" (posix/win32) — Rust exige le runtime posix
    # (`x86_64-pc-windows-gnu` ne supporte pas le modèle de threads win32), jamais garanti par
    # défaut après un `apt-get install` frais (constaté en session : bascule sur win32 par défaut).
    - update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
    - update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
    - rustup target add x86_64-pc-windows-gnu
    - cargo install cargo-deb --locked
    - cd agent
    - cargo build --release --target x86_64-pc-windows-gnu
    - wixl -a x64 -v wix/main.wxs -o allsafe-agent.msi
    - cargo deb
    # Vérifications déjà connues pour être silencieusement cassées côté wixl/msitools par le
    # passé (cf. README § Build) — le job échoue net plutôt que de publier un artefact
    # défectueux sans le signaler.
    - "msiinfo suminfo allsafe-agent.msi | grep -q 'Template: x64;1033'"
    - msiinfo export allsafe-agent.msi Environment | grep -q INSTALLFOLDER
    # Manifeste Windows embarqué dans l'exe (18/08/2026) : `build.rs` fait maintenant échouer
    # le build si `tauri_build` échoue (avant : simple warning avalé — un exe sans manifeste
    # est passé un vrai test utilisateur, crash immédiat "TaskDialogIndirect introuvable" faute
    # de dépendance Common-Controls v6, cf. STATUS.md). Cette assertion couvre en plus le cas
    # où `tauri_build` réussirait sans erreur mais sans réellement embarquer le manifeste (bug
    # amont non détecté par le code de retour) — même esprit que les vérifications msiinfo
    # ci-dessus : échec net plutôt qu'artefact silencieusement cassé.
    - strings target/x86_64-pc-windows-gnu/release/allsafe-agent.exe | grep -q "requireAdministrator"
    - strings target/x86_64-pc-windows-gnu/release/allsafe-agent.exe | grep -q "Microsoft.Windows.Common-Controls"
    # Signature Authenticode (18/08/2026) — étape du build, jamais un script séparé à lancer
    # à la main : no-op tant que le certificat n'est pas configuré (deux variables CI/CD,
    # Settings > CI/CD > Variables) :
    #   AGENT_SIGNING_PFX      — variable de type "File", le .pfx (clé privée + certificat)
    #   AGENT_SIGNING_PASSWORD — variable masquée, mot de passe du .pfx
    # Mécanisme vérifié en conditions réelles (conteneur, certificat de test jetable, timestamp
    # DigiCert réel, 18/08/2026) : `osslsigncode sign` réussit, le Subject du certificat est
    # bien lu dans le binaire signé (`osslsigncode verify` le confirme, y compris le horodatage).
    # ⚠️ Pas de `verify` en garde-fou ici (contrairement aux vérifications wixl ci-dessus) :
    # avec un certificat auto-signé, `verify` échoue TOUJOURS en CI ("self-signed certificate",
    # constaté) puisque rien n'a de raison de faire confiance au certificat Allsafe dans ce
    # conteneur jetable — la confiance se construit sur le parc via GPO, pas en CI. Un `grep
    # Succeeded` sur `verify` ferait donc échouer le job à tort ; on se fie au code de sortie de
    # `sign` lui-même (défaut `set -e` de GitLab CI). Le `.pfx` doit être généré et distribué en
    # confiance (Éditeurs de confiance + Autorités racines de confiance si auto-signé) côté
    # AD/GPO — étape humaine, hors CI, cf. docs/AGENTS.md § Signature.
    - |
      if [ -n "$AGENT_SIGNING_PFX" ]; then
        echo "Signature Authenticode du .exe et du .msi..."
        osslsigncode sign -pkcs12 "$AGENT_SIGNING_PFX" -pass "$AGENT_SIGNING_PASSWORD" \
          -n "Allsafe Agent" -t http://timestamp.digicert.com \
          -in target/x86_64-pc-windows-gnu/release/allsafe-agent.exe \
          -out target/x86_64-pc-windows-gnu/release/allsafe-agent-signed.exe
        mv target/x86_64-pc-windows-gnu/release/allsafe-agent-signed.exe target/x86_64-pc-windows-gnu/release/allsafe-agent.exe
        osslsigncode sign -pkcs12 "$AGENT_SIGNING_PFX" -pass "$AGENT_SIGNING_PASSWORD" \
          -n "Allsafe Agent" -t http://timestamp.digicert.com \
          -in allsafe-agent.msi -out allsafe-agent-signed.msi
        mv allsafe-agent-signed.msi allsafe-agent.msi
      else
        echo "AGENT_SIGNING_PFX non configuré — .exe/.msi non signés (cf. docs/AGENTS.md § Signature)."
      fi
  artifacts:
    paths:
      - agent/target/x86_64-pc-windows-gnu/release/allsafe-agent.exe
      # WebView2Loader.dll (18/08/2026, passage à Tauri, cf. gui.rs) — généré automatiquement
      # par `tauri-build` à côté de l'exe, obligatoire pour lancer l'exe seul (déjà embarqué
      # dans le `.msi`, cf. wix/main.wxs, mais l'usage ".exe seul" en a besoin séparément).
      # Composant Microsoft redistribuable — jamais signé par nous (cf. bloc signature
      # ci-dessus, qui ne touche qu'à `allsafe-agent.exe`/`.msi`).
      - agent/target/x86_64-pc-windows-gnu/release/WebView2Loader.dll
      - agent/allsafe-agent.msi
      - agent/target/debian/*.deb
    expire_in: 1 week

test-backend:
  stage: verify
  needs: ["build-backend"]
  script:
    # SECRET_KEY/DB_PASSWORD : config.py refuse de démarrer avec la valeur par défaut "changeme"
    # (garde-fou anti-.env-oublié, cf. audit/AUDIT_SECURITE_1.md) — valeurs factices, jamais utilisées
    # pour une vraie connexion (les 13 tests sont des fonctions pures ou une AsyncSession mockée,
    # aucune vraie base n'est nécessaire, cf. backend/tests/).
    - docker run --rm -e SECRET_KEY=ci-not-a-real-secret -e DB_PASSWORD=ci-not-a-real-password $BACKEND_IMAGE pytest

scan-backend:
  stage: verify
  needs: ["build-backend"]
  script:
    # --exit-code 0 (informationnel, ne fait jamais échouer le job) : l'image de base
    # python:3.12-slim porte des CVE non corrigeables de notre côté (ex. perl/libperl5.40, sans
    # correctif Debian publié à ce jour, cf. CHECKLIST_DOCKER.md) — un job qui échoue en
    # permanence sans action possible ne sert à rien, juste de l'alerte ignorée. Le but ici est
    # la visibilité à chaque build, pas un gate automatique.
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy image --exit-code 0 --severity HIGH,CRITICAL $BACKEND_IMAGE

scan-frontend:
  stage: verify
  needs: ["build-frontend"]
  script:
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy image --exit-code 0 --severity HIGH,CRITICAL $FRONTEND_IMAGE
