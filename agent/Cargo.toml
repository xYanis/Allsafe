[package]
name = "allsafe-agent"
version = "0.1.3"
edition = "2021"
description = "Agent Allsafe (lecture seule) pour postes Windows/Linux — complète le scan centralisé SSH/WinRM (cf. CLAUDE.md § non-intervention)."
license = "Proprietary"

[[bin]]
name = "allsafe-agent"
path = "src/main.rs"

# Empaquetage .deb (`cargo install cargo-deb` puis `cargo deb`, cf. agent/README.md).
# Service systemd installé/activé automatiquement depuis le 13/08/2026 (`maintainer-
# scripts`, `debian/postinst`/`prerm`) — mode recommandé, cf. `deploy/README.md`. Le cron
# planifiant `allsafe-agent checkin` reste utilisable pour qui ne veut pas de process résident.
[package.metadata.deb]
maintainer = "Allsafe"
copyright = "Allsafe"
extended-description = """\
Agent de collecte en lecture seule pour postes Windows/Linux, complément au scan \
centralisé SSH/WinRM d'Allsafe. Ne modifie et n'exécute jamais rien sur le poste au-delà \
de commandes de lecture locales (cf. CLAUDE.md § non-intervention)."""
depends = "$auto"
section = "admin"
priority = "optional"
maintainer-scripts = "debian"
assets = [
    ["target/release/allsafe-agent", "usr/bin/allsafe-agent", "755"],
    ["deploy/allsafe-agent.service", "lib/systemd/system/allsafe-agent.service", "644"],
]

[dependencies]
# "time" (13/08/2026) : requis par `tokio::time::sleep` dans `daemon.rs` (boucle
# persistante). "macros" gate aussi `tokio::select!` (`service.rs`), pas seulement
# `#[tokio::main]` — gardé malgré l'abandon de cette dernière (cf. main.rs, le point
# d'entrée du service Windows doit s'exécuter AVANT toute création de runtime tokio,
# incompatible avec la macro qui en construit un implicitement).
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
sysinfo = "0.32"
# Enregistrement/boucle Service Control Manager (13/08/2026, service Windows persistant,
# cf. service.rs) — dispatch synchrone appelé avant toute création de runtime tokio.
windows-service = "0.7"
# Auto-installation (17/08/2026, cf. install.rs/gui.rs, docs/AGENTS.md § Installation
# rapide) — fenêtre graphique minimale (serveur + jeton) affichée quand l'exécutable est
# lancé sans argument (double-clic), plutôt que d'exiger un PowerShell/une ligne de
# commande. `native-windows-derive` est le compagnon macro de `native-windows-gui` (le
# `#[derive(NwgUi)]` sur `gui.rs::InstallWindow`), toujours utilisé ensemble.
# ⚠️ NON VÉRIFIÉ EN COMPILATION (pas de toolchain Rust/mingw-w64 disponible dans
# l'environnement où ce code a été écrit, 17/08/2026) — à builder et tester avant de
# considérer ce mode acquis, cf. § Vérification dans docs/AGENTS.md.
# Toutes les features par défaut gardées (pas de sélection fine des composants ici) : le
# nom exact des feature flags pertinents ("textbox"/"button"/...) n'a pas pu être vérifié
# sans toolchain — un mauvais nom ferait échouer la compilation entière plutôt que de
# juste manquer un composant. À affiner une fois un premier build réel obtenu.
native-windows-gui = "1.0"
native-windows-derive = "1.0"

[build-dependencies]
# Manifeste `requireAdministrator` (17/08/2026, cf. build.rs) — seulement actif quand la
# cible est Windows (vérifié dans build.rs via CARGO_CFG_TARGET_OS), no-op sinon. Nécessite
# `windres` sur le PATH pour la compilation croisée depuis Linux — fourni par le paquet
# mingw-w64 déjà requis pour compiler l'exécutable Windows (cf. agent/README.md § Build).
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
