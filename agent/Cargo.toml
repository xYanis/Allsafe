[package]
name = "allsafe-agent"
version = "0.1.5"
edition = "2021"
description = "Agent Allsafe (lecture seule) pour postes Windows/Linux — complète le scan centralisé SSH/WinRM (cf. CLAUDE.md § non-intervention)."
license = "Proprietary"

[[bin]]
name = "allsafe-agent"
path = "src/main.rs"

# Empaquetage .deb (`cargo install cargo-deb` puis `cargo deb`, cf. agent/README.md).
# Service systemd installé/activé automatiquement depuis le 13/08/2026 (`maintainer-
# scripts`, `debian/postinst`/`prerm`) — mode recommandé, cf. `deploy/README.md`. Le cron
# planifiant `allsafe-agent checkin` reste utilisable pour qui ne veut pas de process résident.
[package.metadata.deb]
maintainer = "Allsafe"
copyright = "Allsafe"
extended-description = """\
Agent de collecte en lecture seule pour postes Windows/Linux, complément au scan \
centralisé SSH/WinRM d'Allsafe. Ne modifie et n'exécute jamais rien sur le poste au-delà \
de commandes de lecture locales (cf. CLAUDE.md § non-intervention)."""
depends = "$auto"
section = "admin"
priority = "optional"
maintainer-scripts = "debian"
assets = [
    ["target/release/allsafe-agent", "usr/bin/allsafe-agent", "755"],
    ["deploy/allsafe-agent.service", "lib/systemd/system/allsafe-agent.service", "644"],
]

[dependencies]
# "time" (13/08/2026) : requis par `tokio::time::sleep` dans `daemon.rs` (boucle
# persistante). "macros" gate aussi `tokio::select!` (`service.rs`), pas seulement
# `#[tokio::main]` — gardé malgré l'abandon de cette dernière (cf. main.rs, le point
# d'entrée du service Windows doit s'exécuter AVANT toute création de runtime tokio,
# incompatible avec la macro qui en construit un implicitement).
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
# Vérification d'intégrité du .msi de mise à jour avant exécution (18/08/2026, cf.
# audit/AUDIT_SECURITE.md #13 — install.rs::apply_update).
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
sysinfo = "0.32"
# Enregistrement/boucle Service Control Manager (13/08/2026, service Windows persistant,
# cf. service.rs) — dispatch synchrone appelé avant toute création de runtime tokio.
windows-service = "0.7"
# Auto-installation (17/08/2026, cf. install.rs/gui.rs, docs/AGENTS.md § Installation
# rapide) — fenêtre graphique (serveur + jeton, menu Installation/Réparation/Mise à
# jour/Désinstallation) affichée quand l'exécutable est lancé sans argument (double-clic).
#
# 18/08/2026 — remplace `native-windows-gui` (retiré) : rendu Win32 classique plafonnant à
# un thème "Windows 7 correct" au mieux (Common Controls v6 n'apporte jamais le rendu
# Fluent/moderne, quel que soit le manifeste — limite du Win32 classique lui-même, testé en
# conditions réelles). `tauri` rend l'interface en HTML/CSS via le WebView2 déjà présent
# nativement sur Windows 10 (1803+)/11.
#
# ✅ Vérifié par compilation + link croisés réels (toolchain mingw-w64, conteneur, 18/08/2026) :
# l'arbre de dépendances complet (`tauri`/`wry`/`webview2-com`) compile et **link** pour
# `x86_64-pc-windows-gnu` malgré une réputation de support GNU historiquement fragile dans
# l'écosystème.
#
# ⚠️ **Conséquence assumée, casse le "un seul .exe"** : sur cette cible GNU précisément (pas
# MSVC), le binaire importe statiquement `CreateCoreWebView2EnvironmentWithOptions` depuis
# `WebView2Loader.dll` — résolu par Windows AVANT `main()`, donc impossible à extraire "à la
# volée" au lancement. Ce petit fichier (~200 Ko, généré automatiquement par `tauri-build` à
# côté de l'exe compilé) doit être présent dans le même dossier, aussi bien pour l'usage
# `.exe` seul (cf. agent/README.md § Installation directe) que dans le `.msi` (cf.
# wix/main.wxs, deuxième `<File>` du même composant). Décision actée : accepter ce fichier
# compagnon statique (aucune logique/script, juste un fichier de plus) plutôt que basculer
# tout le pipeline de build vers MSVC (jamais testé, casserait la cross-compilation depuis
# Linux/CI actuelle) ou rester sur le rendu Win32 plafonné.
tauri = { version = "2", features = [] }
# `FreeConsole` (18/08/2026, cf. gui.rs) — l'exécutable reste subsystem "console" (la CLI
# `enroll`/`checkin`/`install --token...` a besoin que sa sortie `println!` s'affiche dans
# le terminal appelant), donc Windows alloue quand même une console au lancement, y compris
# pour le mode graphique — fenêtre noire vide visible derrière la fenêtre Tauri tant qu'on
# ne s'en détache pas explicitement (constaté en conditions réelles). `winapi` déjà présent
# transitivement (`tauri`/`windows-service`) — déclaré ici en direct pour l'appeler depuis
# gui.rs sans dépendre d'un détail d'implémentation d'un tiers.
winapi = { version = "0.3", features = ["wincon"] }

[build-dependencies]
# `tauri-build` (18/08/2026, remplace `winres` direct) — gère l'icône + le manifeste Windows
# (dont `requireAdministrator`, injecté via `WindowsAttributes::app_manifest`, cf. build.rs)
# en un seul appel unifié : pas de risque de conflit entre deux embarqueurs de ressource
# séparés qui se marcheraient dessus sur le même identifiant de ressource. Copie aussi
# automatiquement `WebView2Loader.dll` à côté de l'exe compilé pour la cible GNU (cf.
# commentaire `tauri` ci-dessus).
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = "z"
lto = true
strip = true
