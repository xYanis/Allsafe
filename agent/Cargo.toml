[package]
name = "allsafe-agent"
version = "0.1.4"
edition = "2021"
description = "Agent Allsafe (lecture seule) pour postes Windows/Linux — complète le scan centralisé SSH/WinRM (cf. CLAUDE.md § non-intervention)."
license = "Proprietary"

[[bin]]
name = "allsafe-agent"
path = "src/main.rs"

# Empaquetage .deb (`cargo install cargo-deb` puis `cargo deb`, cf. agent/README.md).
# Service systemd installé/activé automatiquement depuis le 13/08/2026 (`maintainer-
# scripts`, `debian/postinst`/`prerm`) — mode recommandé, cf. `deploy/README.md`. Le cron
# planifiant `allsafe-agent checkin` reste utilisable pour qui ne veut pas de process résident.
[package.metadata.deb]
maintainer = "Allsafe"
copyright = "Allsafe"
extended-description = """\
Agent de collecte en lecture seule pour postes Windows/Linux, complément au scan \
centralisé SSH/WinRM d'Allsafe. Ne modifie et n'exécute jamais rien sur le poste au-delà \
de commandes de lecture locales (cf. CLAUDE.md § non-intervention)."""
depends = "$auto"
section = "admin"
priority = "optional"
maintainer-scripts = "debian"
assets = [
    ["target/release/allsafe-agent", "usr/bin/allsafe-agent", "755"],
    ["deploy/allsafe-agent.service", "lib/systemd/system/allsafe-agent.service", "644"],
]

[dependencies]
# "time" (13/08/2026) : requis par `tokio::time::sleep` dans `daemon.rs` (boucle
# persistante). "macros" gate aussi `tokio::select!` (`service.rs`), pas seulement
# `#[tokio::main]` — gardé malgré l'abandon de cette dernière (cf. main.rs, le point
# d'entrée du service Windows doit s'exécuter AVANT toute création de runtime tokio,
# incompatible avec la macro qui en construit un implicitement).
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
sysinfo = "0.32"
# Enregistrement/boucle Service Control Manager (13/08/2026, service Windows persistant,
# cf. service.rs) — dispatch synchrone appelé avant toute création de runtime tokio.
windows-service = "0.7"
# Auto-installation (17/08/2026, cf. install.rs/gui.rs, docs/AGENTS.md § Installation
# rapide) — fenêtre graphique (serveur + jeton, menu Installation/Réparation/Mise à
# jour/Désinstallation) affichée quand l'exécutable est lancé sans argument (double-clic),
# plutôt que d'exiger un PowerShell/une ligne de commande.
#
# 18/08/2026 — remplace `native-windows-gui` (retiré) : rendu Win32 classique plafonnant à
# un thème "Windows 7 correct" au mieux (Common Controls v6 n'apporte jamais le rendu
# Fluent/moderne des applis natives récentes, quel que soit le manifeste — limite du Win32
# classique lui-même, pas un réglage manqué, cf. docs/AGENTS.md § Vérification), jugé
# insuffisant en conditions réelles. `tauri` rend l'interface en HTML/CSS via le WebView2
# déjà présent nativement sur Windows 10 (1803+)/11 — aucun runtime supplémentaire à
# installer sur le parc. ✅ Vérifié par compilation + link croisés réels (toolchain mingw-w64,
# conteneur, 18/08/2026) : l'arbre de dépendances complet (`tauri`/`wry`/`webview2-com`,
# lié aux bindings COM Windows) compile et **link** pour `x86_64-pc-windows-gnu` malgré une
# réputation de support GNU historiquement fragile dans l'écosystème — pas de repli MSVC
# nécessaire pour ce projet. **Reste non vérifié** : comportement runtime réel du WebView2
# (chargement de la page, appels `invoke` JS → Rust) sur un vrai poste Windows.
tauri = { version = "2", features = [] }
# `FreeConsole` (18/08/2026, cf. gui.rs) — l'exécutable reste subsystem "console" (la CLI
# `enroll`/`checkin`/`install --token...` a besoin que sa sortie `println!` s'affiche dans
# le terminal appelant), donc Windows alloue quand même une console au lancement, y compris
# pour le mode graphique (double-clic) — fenêtre noire vide visible derrière la fenêtre
# Tauri tant qu'on ne s'en détache pas explicitement (constaté en conditions réelles,
# initialement avec native-windows-gui — même souci, indépendant du framework graphique
# utilisé puisqu'il vient du subsystem de l'exe lui-même). `winapi` déjà présent
# transitivement (`tauri`/`windows-service`) — déclaré ici en direct pour l'appeler depuis
# gui.rs sans dépendre d'un détail d'implémentation d'un tiers.
winapi = { version = "0.3", features = ["wincon"] }

[build-dependencies]
# `tauri-build` (18/08/2026, remplace `winres` direct) — gère lui-même l'icône + le
# manifeste Windows (dont `requireAdministrator`, injecté via
# `WindowsAttributes::app_manifest`, cf. build.rs) en un seul appel unifié : pas de risque de
# conflit entre deux embarqueurs de ressource séparés (`winres` manuel + celui de `tauri`)
# qui se marcheraient dessus sur le même identifiant de ressource.
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = "z"
lto = true
strip = true
