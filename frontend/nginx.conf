# Sert le build Vite (stage "prod" du Dockerfile) + reverse-proxy /api vers le
# backend — reproduit le proxy de vite.config.js pour que le build de
# production se comporte à l'identique du serveur de dev, y compris le
# forwarding d'IP réelle consommé par routers/connections.py.
server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # backend-prod (13/08/2026), pas backend — ce nginx ne sert que le stage "prod"
        # (frontend-prod), qui tourne aux côtés de backend-prod, jamais du service dev
        # `backend` (ports/réseau prod indépendants, cf. docker-compose.yml § profil "prod").
        proxy_pass http://backend-prod:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr écrase plutôt que $proxy_add_x_forwarded_for qui ajoute (10/08/2026,
        # cf. audit/AUDIT_SECURITE.md #9) : un seul reverse-proxy entre le client et le backend,
        # pas besoin de préserver une chaîne — sans ça, un client qui envoie son propre
        # X-Forwarded-For se faisait passer pour l'IP de son choix (verrou anti-bruteforce
        # par IP contournable, piste d'audit NIS 2 falsifiable).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA : toute route inconnue du serveur de fichiers retombe sur index.html
    # (react-router-dom prend la main côté client) — sans ça, un rechargement
    # de page sur /vulnerabilities ou /veille renverrait 404 (nginx ne connaît
    # pas ces routes, elles n'existent que côté client).
    location / {
        try_files $uri /index.html;

        # En-têtes de sécurité (18/08/2026, cf. audit/AUDIT_SECURITE.md #33) — le
        # middleware `security_headers` du backend (cf. audit/AUDIT_SECURITE.md #11) ne
        # couvre que les réponses proxées via /api/ ci-dessus ; les fichiers statiques
        # (index.html, bundles JS/CSS) servis directement par nginx pour cette location
        # n'avaient aucun en-tête de réponse. Scopés à `location /` (pas au niveau
        # `server`) pour ne pas dupliquer/entrer en conflit avec les en-têtes déjà posés
        # par le backend sur les réponses `/api/` proxées.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }
}
